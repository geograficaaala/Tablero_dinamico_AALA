name: Validar fórmulas — Atitlán Recicla

on:
  push:
    branches: [main]
    paths:
      - 'data/atitlan_recicla/**'
      - 'references/atitlan_recicla/**'
      - 'scripts/atitlan_recicla/**'
      - 'src/programs/atitlan_recicla/**'
      - 'tests/atitlan_recicla/**'
      - '.github/workflows/validar-formulas-atitlan-recicla.yml'
  pull_request:
    paths:
      - 'data/atitlan_recicla/**'
      - 'references/atitlan_recicla/**'
      - 'src/programs/atitlan_recicla/**'
      - 'tests/atitlan_recicla/**'
      - '.github/workflows/validar-formulas-atitlan-recicla.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validar tablas y precálculos
        run: python scripts/atitlan_recicla/validate_data.py
      - name: Validar indicadores y fórmulas
        run: node --test tests/atitlan_recicla/paridad.test.mjs
