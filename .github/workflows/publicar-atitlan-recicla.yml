name: Publicar dashboards AALA
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'config/**'
      - 'data/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/publicar-atitlan-recicla.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/atitlan_recicla/validate_data.py
      - run: node --test tests/atitlan_recicla/paridad.test.mjs tests/atitlan_recicla/fase3.test.mjs
      - run: python scripts/conservando_atitlan/validate_data.py
      - run: node --test tests/conservando_atitlan/paridad.test.mjs tests/conservando_atitlan/html.test.mjs tests/conservando_atitlan/modulos.test.mjs
      - run: python scripts/fortalecimiento_municipal/validate_data.py
      - run: node --test tests/fortalecimiento_municipal/paridad.test.mjs
      - run: python scripts/educando_para_conservar/validate_data.py
      - run: node --test tests/educando_para_conservar/paridad.test.mjs
      - run: python scripts/reforestacion/validate_data.py
      - run: node --test tests/reforestacion/paridad.test.mjs tests/reforestacion/funcional.test.mjs
      - run: python scripts/tul/validate_data.py
      - run: node --test tests/tul/paridad.test.mjs tests/tul/modulos.test.mjs tests/tul/arranque.test.mjs
      - run: node --test tests/index/portal.test.mjs
      - run: node --test tests/index/datos.test.mjs
      - run: |
          mkdir -p dist
          cp -R public src data config dist/
          python scripts/index/build_portal.py
      - run: |
          python - <<'PY_CHECK'
          from pathlib import Path
          page = Path('dist/index.html').read_text(encoding='utf-8')
          for name in ('atitlan-recicla', 'conservando-atitlan', 'fortalecimiento-municipal', 'educando-para-conservar', 'reforestando-atitlan', 'tul'):
              assert Path(f'dist/public/{name}.html').is_file(), f'HTML faltante: {name}'
              assert f'href="./public/{name}.html"' in page, f'Acceso faltante: {name}'
          print('OK: seis accesos y HTML de destino publicados')
          PY_CHECK
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
