name: Publicar Atitlán Recicla
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'src/**'
      - 'config/atitlan_recicla/**'
      - 'data/atitlan_recicla/**'
      - '.github/workflows/publicar-atitlan-recicla.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/atitlan_recicla/validate_data.py
      - run: node --test tests/atitlan_recicla/paridad.test.mjs tests/atitlan_recicla/fase3.test.mjs tests/atitlan_recicla/importaciones.test.mjs
      - run: |
          mkdir -p dist
          cp -R public src data config dist/
          sed -e 's|href="./atitlan-recicla.html"|href="./public/atitlan-recicla.html"|' -e 's|href="../src/styles/global.css"|href="./src/styles/global.css"|' public/index.html > dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
